services:
  search-eve:
    image: ghcr.io/ionaru/search-eve:${SEARCHEVE_GIT_REVISION:-latest}
    build:
      context: ../
      dockerfile: deploy/Dockerfile
    environment:
      - DEBUG
    # No published ports. The service listens on 3000 and is reached over the
    # "edge" network by the reverse proxy, as http://search-eve:3000.
    networks:
      - edge
    volumes:
      - ${SEARCHEVE_DATA_VOLUME:-data}:/app/data
    restart: unless-stopped
    init: true
    healthcheck:
      # /shortcuts needs no query parameters and is served from memory, so it is
      # a cheap readiness probe. The port is only opened after the whole EVE
      # universe has been cached, which on a cold start takes several minutes -
      # hence the long start_period.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/shortcuts').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10m
      start_interval: 15s

networks:
  # Shared with the reverse proxy; created outside this stack.
  edge:
    external: true

volumes:
  data:
